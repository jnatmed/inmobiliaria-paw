<section class="input-busqueda">
    <div class="busqueda-ubicacion-controles">

        <div class="busqueda-ubicacion-campo">

            <input type="text" id="ubicacion" class="input-form-publicacion" placeholder="Ingrese su dirección" autocomplete="off" required>

            <div id="resultados-ubicacion" class="autocomplete-results-container" hidden>
                <ul
                    id="lista-resultados-ubicacion"
                    class="autocomplete-list"
                ></ul>
            </div>
        </div>

        <button type="button" id="buscarUbicacion" aria-label="Buscar ubicación">
            🔍︎
        </button>

        <div class="loader" aria-hidden="true"></div>

    </div>

    <p
        id="mensaje-busqueda-ubicacion"
        class="mensaje-busqueda-ubicacion"
        role="status"
        aria-live="polite"
    ></p>
    
</section>

<div id="mapid"></div>
