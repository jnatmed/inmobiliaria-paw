{% set datosMapa = datos|default({}) %}

<section class="input-busqueda">
    <div class="busqueda-ubicacion-controles">

        <div class="busqueda-ubicacion-campo">

            <input type="text" name="ubicacion" id="ubicacion" class="input-form-publicacion" placeholder="Ingrese su dirección" autocomplete="off" required
                value="{{ datosMapa['ubicacion']|default(
                    datosMapa['direccion_completa']|default('')
                ) }}"
            >

            <div id="resultados-ubicacion" class="autocomplete-results-container" hidden>
                <ul
                    id="lista-resultados-ubicacion"
                    class="autocomplete-list"
                ></ul>
            </div>
        </div>

        <div class="busqueda-ubicacion-acciones">

            <button type="button" id="buscarUbicacion" aria-label="Buscar ubicación">

                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
                    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.5"></circle>
                    <line x1="16" y1="16" x2="22" y2="22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
                </svg>
            </button>

            <div class="loader" aria-hidden="true"></div>

        </div>

    </div>

    <p
        id="mensaje-busqueda-ubicacion"
        class="mensaje-busqueda-ubicacion"
        role="status"
        aria-live="polite"
    ></p>
    
</section>

<div id="mapid"></div>
