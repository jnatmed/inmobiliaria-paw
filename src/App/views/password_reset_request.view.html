<!DOCTYPE html>
<html lang="es">

<head>
    {% include 'parts/head.view.html' %}
</head>

<body class="login_bg">

    <main class="login_form_container">

        <section class="login_form_header">
            <a href="/" aria-label="Ir al inicio de Pawperties">
                <span class="icono-header-pawperties" aria-hidden="true">
                    PawPerties
                </span>
            </a>

            <h1 class="login_title"> RESETEAR CONTRASEÑA </h1>
        </section>

        <section class="login_form">

            {% if resetear_de_contrasenia_solicitado %}

                <form action="/recuperar-contrasenia" method="post">

                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <input type="hidden" name="reset_token" value="{{ reset_token }}">

                    <label for="password"> Nueva contraseña </label>

                    <input
                        required
                        type="password"
                        name="password"
                        id="password"
                        minlength="8"
                        maxlength="255"
                        autocomplete="new-password"
                        placeholder="Ingrese la nueva contraseña"
                    >

                    <label for="password_repeat"> Repetir contraseña </label>

                    <input
                        required
                        type="password"
                        name="password_repeat"
                        id="password_repeat"
                        minlength="8"
                        maxlength="255"
                        autocomplete="new-password"
                        placeholder="Ingrese nuevamente la contraseña"
                    >

                    <input type="submit" value="CAMBIAR CONTRASEÑA">

                </form>

            {% else %}

                <form action="/recuperar-contrasenia" method="post">

                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <label for="email"> Email </label>

                    <input
                        required
                        type="email"
                        name="email"
                        id="email"
                        autocomplete="email"
                        placeholder="Ingrese su correo electrónico"
                    >

                    <input type="submit" value="ENVIAR">
                    
                </form>

            {% endif %}

            {% if exito is defined %}
                {% if exito %}
                    <p class="msj_exito" role="status" aria-live="polite">
                        {{ mensaje }}
                    </p>
                {% else %}
                    <p class="msj_error" role="alert">
                        {{ mensaje }}
                    </p>
                {% endif %}
            {% endif %}

        </section>

    </main>

</body>

</html>
