<!DOCTYPE html>
<html lang="es">

<head>
    {% include 'parts/head.view.html' %}
</head>

<body class="login_bg">

    <main class="login_form_container">

        <section class="login_form_header">
            <a href="/" aria-label="Ir al inicio de Pawperties">
                <span class="icono-header-pawperties" aria-hidden="true"> PawPerties </span>
            </a>
            <h1 class="login_title"> INICIO SESIÓN </h1>
        </section>

        <section class="login_form">
            <form action="/iniciar-sesion" method="post" novalidate>

                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <label for="email">Email</label>
                <input required type="email" name="email" id="email" autocomplete="email" placeholder="Ingrese su correo electrónico">
                
                <label for="contrasenia">Contraseña</label>
                <input required type="password" name="contrasenia" id="contrasenia" autocomplete="current-password" placeholder="Ingrese su contraseña">
                
                <input type="submit" value="INICIAR SESION">
            </form>

            <form action="/registrarse" method="get">
                <input type="submit" value="REGISTRARSE">
            </form>

            <a href="/recuperar-contrasenia">¿Olvidaste tu contraseña?</a>

            {% if resultado is defined and resultado.error is not empty %}
                <p class="error-registro" role="alert">{{ resultado.error|e }}</p>
            {% endif %}

            {% if exito is defined %}
                {% if exito %}
                    <p class="msj_exito" role="status" aria-live="polite">{{ mensaje }}</p>
                {% else %}
                    <p class="msj_error" role="alert">{{ mensaje }}</p>
                {% endif %}
            {% endif %}
            
        </section>

    </main>

</body>

</html>
